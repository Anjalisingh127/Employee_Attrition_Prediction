[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "employee-attrition-analytics"
version = "0.3.0"
description = "Leakage-safe employee attrition prediction and HR analytics project."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "pandas>=2.3,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
attrition-validate = "attrition.validation:main"
attrition-eda = "attrition.eda:main"

[tool.hatch.build.targets.wheel]
packages = ["src/attrition"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
